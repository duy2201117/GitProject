<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tối ưu CSS bằng SASS Variables & Mixins</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .demo { width: min(900px, 90%); margin: 40px auto; }
    .actions { margin: 24px 0; }
  </style>
</head>
<body>
  <main class="demo">
    <h1>SASS Variables & Mixins</h1>
    <h2>Tối ưu CSS và tăng khả năng tái sử dụng</h2>

    <div class="actions">
      <button class="button">Nút sử dụng mixin</button>
    </div>

    <article class="card">
      <h2 class="card__title">Card sử dụng mixin</h2>
      <p class="card__text">
        Màu sắc, font-size, padding, border-radius và box-shadow đều được quản lý bằng biến SASS.
      </p>
    </article>
  </main>
</body>
</html>
