<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 70%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>

    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Laptop Lenovo</td>
            <td>15.000.000 VNĐ</td>
            <td>5</td>
        </tr>
        <tr>
            <td>Chuột không dây</td>
            <td>250.000 VNĐ</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Bàn phím cơ</td>
            <td>850.000 VNĐ</td>
            <td>12</td>
        </tr>
        <tr>
            <td>Tai nghe Bluetooth</td>
            <td>600.000 VNĐ</td>
            <td>10</td>
        </tr>
    </table>
</body>
</html>
